# Render Blueprint
services:
  - type: web
    name: personal-portfolio-001-frontend
    env: static
    buildCommand: npm ci && npm run build
  - type: web
    name: personal-portfolio-001-backend
    env: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health

databases:
  - name: personal-portfolio-001-db
    databaseName: personal_portfolio_001
